[package]
name = "yt-dlp-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "7"
log = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
parking_lot = "0.13"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSColorSpace"] }
